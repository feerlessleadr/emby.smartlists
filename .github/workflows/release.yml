name: Release

# Publishing: push a tag such as v0.1.8 (git tag v0.1.8 && git push origin v0.1.8).
# The workflow runs the tests first (a failure stops it before anything is published), then builds the single
# self-contained Emby.Plugin.SmartLists.dll with that version and creates the GitHub release with that DLL as
# the ONLY asset (the GitHub plugin installer prefers a loose .dll). The release notes are docs/releases/<tag>.md;
# if that file is missing, GitHub generates notes from the commits.
#
# It runs on Windows because the tests load Emby's own (Windows) server assemblies, which do not load on Linux.
#
# Dry run: Actions > Release > Run workflow builds the DLL and attaches it to the run as an
# artifact, without creating a release or tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, for example 0.1.8 (dry run: nothing is published)'
        required: true
        default: '0.0.1'

permissions:
  contents: write

env:
  # The plugin compiles against this Emby Server build (its assemblies are not on NuGet).
  EMBY_VERSION: 4.10.1.0

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') {
              Write-Output "::error::Tag '$tag' must look like v1.2.3 (or v1.2.3-rc.1 for a pre-release)."
              exit 1
            }
            # v1.2.3 (or v1.2.3-rc.1) -> assembly version 1.2.3
            $version = ($tag -replace '^v', '') -replace '-.*$', ''
          } else {
            $tag = 'dry-run'
            $version = $env:INPUT_VERSION
            if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
              Write-Output "::error::Version '$version' must look like 1.2.3."
              exit 1
            }
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache the Emby server download
        id: emby-cache
        uses: actions/cache@v4
        with:
          path: emby-server.7z
          key: emby-server-${{ env.EMBY_VERSION }}

      - name: Download the Emby server
        if: steps.emby-cache.outputs.cache-hit != 'true'
        run: |
          $url = "https://github.com/MediaBrowser/Emby.Releases/releases/download/$($env:EMBY_VERSION)/embyserver-win-x64-$($env:EMBY_VERSION).7z"
          Invoke-WebRequest -Uri $url -OutFile emby-server.7z

      - name: Extract the Emby assemblies
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'emby'
          & "C:\Program Files\7-Zip\7z.exe" x -y "-o$dest" emby-server.7z | Out-Null
          $model = Get-ChildItem -Path $dest -Recurse -Filter MediaBrowser.Model.dll | Select-Object -First 1
          if (-not $model) {
            Write-Output '::error::MediaBrowser.Model.dll not found in the Emby archive'
            exit 1
          }
          "EMBY_SYSTEM_DIR=$($model.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # A failing test stops the workflow here: nothing is built for release and no release is created.
      - name: Run the tests
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'test.log'
          dotnet test Emby.Plugin.SmartLists.Tests/Emby.Plugin.SmartLists.Tests.csproj --configuration Release "-p:EmbySystemDir=$env:EMBY_SYSTEM_DIR" --nologo 2>&1 | Tee-Object -FilePath $log
          exit $LASTEXITCODE

      # Puts the failure lines into a run annotation so they are visible without downloading the log.
      - name: Summarize test failures
        if: failure()
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'test.log'
          if (Test-Path $log) {
            $lines = Get-Content $log
            $hits = $lines | Select-String -Pattern 'error |Failed |Assert|Exception|Unhandled|Could not|not found|Passed!|Failed!|Total' | Select-Object -First 40 | ForEach-Object { $_.Line }
            $all = @($hits) + '--- tail ---' + ($lines | Select-Object -Last 25)
            $text = ($all | ForEach-Object { if ($_.Length -gt 400) { $_.Substring(0, 400) } else { $_ } }) -join '%0A'
            Write-Output "::error title=Test run output::$text"
          }

      - name: Build
        run: |
          dotnet build Emby.Plugin.SmartLists/Emby.Plugin.SmartLists.csproj --configuration Release "-p:EmbySystemDir=$env:EMBY_SYSTEM_DIR" "-p:Version=${{ steps.version.outputs.version }}" --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item Emby.Plugin.SmartLists/bin/Release/net8.0/Emby.Plugin.SmartLists.dll artifacts/Emby.Plugin.SmartLists.dll
          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Dry run - keep the DLL as a run artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Emby.Plugin.SmartLists-${{ steps.version.outputs.version }}
          path: artifacts/Emby.Plugin.SmartLists.dll

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $notes = "docs/releases/$tag.md"
          $ghArgs = @('release', 'create', $tag, 'artifacts/Emby.Plugin.SmartLists.dll', '--title', $tag)
          if ($tag -like '*-*') { $ghArgs += '--prerelease' }
          if (Test-Path $notes) {
            $ghArgs += @('--notes-file', $notes)
          } else {
            Write-Output "::warning::$notes not found, generating notes from the commits"
            $ghArgs += '--generate-notes'
          }
          gh @ghArgs
          exit $LASTEXITCODE
