name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_VERSION: 10.0.x

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # See ci.yml: the Emby server assemblies come from the EMBY_SERVER_URL repository variable.
      - name: Fetch Emby server assemblies
        env:
          EMBY_SERVER_URL: ${{ vars.EMBY_SERVER_URL }}
        run: |
          if [ -z "$EMBY_SERVER_URL" ]; then
            echo "::error::Repository variable EMBY_SERVER_URL is not set (see docs/development.md, CI)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/emby"
          curl -fsSL "$EMBY_SERVER_URL" -o "$RUNNER_TEMP/emby/server.archive"
          case "$EMBY_SERVER_URL" in
            *.zip) unzip -q "$RUNNER_TEMP/emby/server.archive" -d "$RUNNER_TEMP/emby/x" ;;
            *)     mkdir "$RUNNER_TEMP/emby/x" && tar -xf "$RUNNER_TEMP/emby/server.archive" -C "$RUNNER_TEMP/emby/x" ;;
          esac
          model=$(find "$RUNNER_TEMP/emby/x" -name MediaBrowser.Model.dll | head -1)
          if [ -z "$model" ]; then echo "::error::MediaBrowser.Model.dll not found in the archive"; exit 1; fi
          echo "EMBY_SYSTEM_DIR=$(dirname "$model")" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          dotnet restore Emby.Plugin.SmartLists.sln
          dotnet test Emby.Plugin.SmartLists.Tests/Emby.Plugin.SmartLists.Tests.csproj --configuration Release --no-restore

      - name: Package
        id: package
        run: |
          # Tag v1.2.3 (optionally -rc.1 etc.) -> assembly version 1.2.3
          VERSION=$(echo "$GITHUB_REF_NAME" | sed -E 's/^v//; s/-.*$//')
          dotnet build Emby.Plugin.SmartLists/Emby.Plugin.SmartLists.csproj --configuration Release -p:Version="$VERSION" --no-restore
          mkdir -p artifacts
          out=Emby.Plugin.SmartLists/bin/Release/net8.0
          zip -j "artifacts/Emby.Plugin.SmartLists-$VERSION.zip" "$out/Emby.Plugin.SmartLists.dll" "$out/SixLabors.ImageSharp.dll"
          echo "zip=artifacts/Emby.Plugin.SmartLists-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" --title "$GITHUB_REF_NAME" --generate-notes $flags
