name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Build and test need nothing but the source and the Emby server assemblies.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The plugin compiles against Emby's own assemblies (MediaBrowser.Common/Controller/Model), which are
      # not on NuGet and are not redistributed here. Set the repository variable EMBY_SERVER_URL to a download
      # URL for an Emby Server 4.10.1.0 archive (.zip or .tar.gz) that contains a "system" folder.
      - name: Fetch Emby server assemblies
        env:
          EMBY_SERVER_URL: ${{ vars.EMBY_SERVER_URL }}
        run: |
          if [ -z "$EMBY_SERVER_URL" ]; then
            echo "::error::Repository variable EMBY_SERVER_URL is not set (see docs/development.md, CI)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/emby"
          curl -fsSL "$EMBY_SERVER_URL" -o "$RUNNER_TEMP/emby/server.archive"
          case "$EMBY_SERVER_URL" in
            *.zip) unzip -q "$RUNNER_TEMP/emby/server.archive" -d "$RUNNER_TEMP/emby/x" ;;
            *)     mkdir "$RUNNER_TEMP/emby/x" && tar -xf "$RUNNER_TEMP/emby/server.archive" -C "$RUNNER_TEMP/emby/x" ;;
          esac
          model=$(find "$RUNNER_TEMP/emby/x" -name MediaBrowser.Model.dll | head -1)
          if [ -z "$model" ]; then echo "::error::MediaBrowser.Model.dll not found in the archive"; exit 1; fi
          echo "EMBY_SYSTEM_DIR=$(dirname "$model")" >> "$GITHUB_ENV"

      - name: Restore dependencies
        run: dotnet restore Emby.Plugin.SmartLists.sln

      - name: Build plugin
        run: >-
          dotnet build Emby.Plugin.SmartLists/Emby.Plugin.SmartLists.csproj
          --configuration Release --no-restore

      - name: Run tests
        run: >-
          dotnet test Emby.Plugin.SmartLists.Tests/Emby.Plugin.SmartLists.Tests.csproj
          --configuration Release --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
          retention-days: 14
